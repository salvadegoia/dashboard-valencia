/* ===== HELPERS ===== */
const fmtBRL = (v) => "R$ " + Math.round(v).toLocaleString("pt-BR");
const fmtMi = (v) => "R$ " + (v / 1e6).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " mi";
const fmtMil = (v) => "R$ " + Math.round(v / 1000).toLocaleString("pt-BR") + " mil";
const axisMoney = (v) => "R$ " + (v / 1e6).toFixed(1).replace(".", ",") + "M";
const pct = (v) => v.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "%";

function useCountUp(target, deps) {
  const [n, setN] = useState(target);
  useEffect(() => {
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) { setN(target); return; }
    let raf; const start = performance.now(); const dur = 800;
    const tick = (t) => {
      const p = Math.min(1, (t - start) / dur);
      setN(target * (1 - Math.pow(1 - p, 3)));
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, deps);
  return n;
}
function useCompetencia(competencia) {
  return useMemo(() => {
    const total = TOTAL_COMPETENCIA[competencia];
    const escala = total / TOTAL_COMPETENCIA["Setembro 2026"];
    const vend = VENDEDORES.map((v) => ({
      ...v,
      realizado: Math.round((v.realizado * escala) / 1000) * 1000,
      ant: Math.round((v.ant * escala) / 1000) * 1000,
    }));
    const porFilial = FILIAIS.map((f) => ({
      name: f, value: vend.filter((v) => v.filial === f).reduce((s, v) => s + v.realizado, 0),
    }));
    const mesAtual = COMP_TO_MES[competencia];
    const idx = MENSAL.findIndex((m) => m.mes === mesAtual);
    const deltaPct = idx > 0 ? ((MENSAL[idx].valor - MENSAL[idx - 1].valor) / MENSAL[idx - 1].valor) * 100 : 0;
    return { total, vend, porFilial, deltaPct, pctMeta: (total / META_MES) * 100, mesAtual };
  }, [competencia]);
}

/* ===== UI ===== */
function Delta({ value, suffix = "%", invert = false }) {
  const isFlat = Math.abs(value) < 0.05;
  const positive = invert ? value < 0 : value > 0;
  const color = isFlat ? C.textDim : positive ? C.neon : C.alerta;
  const iconName = isFlat ? "Minus" : positive ? "ArrowUpRight" : "ArrowDownRight";
  const sign = value > 0 ? "+" : "";
  return (
    <span className="inline-flex items-center gap-1 text-sm font-semibold" style={{ color }}>
      <Icon name={iconName} size={14} strokeWidth={2.5} />
      {sign}{value.toLocaleString("pt-BR", { maximumFractionDigits: 1 })}{suffix}
      <span className="font-normal" style={{ color: C.textFaint }}>vs mês ant.</span>
    </span>
  );
}
function KpiCard({ label, value, delta, deltaSuffix, invert, icon, tone = "normal" }) {
  const accent = tone === "risco" ? C.alerta : tone === "hero" ? C.laranja : C.textDim;
  return (
    <div className="rounded-2xl p-5 flex flex-col justify-between" style={{ background: C.surface, border: `1px solid ${C.border}`, minHeight: 128 }}>
      <div className="flex items-center justify-between">
        <span className="text-sm" style={{ color: C.textDim }}>{label}</span>
        <span className="rounded-lg p-1.5" style={{ background: "rgba(255,247,237,0.05)" }}>
          <Icon name={icon} size={16} color={accent} />
        </span>
      </div>
      <div>
        <div className="font-sora font-bold tracking-tight" style={{ color: C.text, fontSize: 28, lineHeight: 1.1 }}>{value}</div>
        {delta !== undefined && <div className="mt-1"><Delta value={delta} suffix={deltaSuffix} invert={invert} /></div>}
      </div>
    </div>
  );
}
function ChartCard({ title, subtitle, right, children, className = "" }) {

          {subtitle && <p className="text-sm mt-0.5" style={{ color: C.textDim }}>{subtitle}</p>}

        {right}

}
function ChartTooltip({ active, payload, label, money = true }) {
  if (!active || !payload || !payload.length) return null;
  return (
    <div className="rounded-xl px-3 py-2 text-sm" style={{ background: "#0A180E", border: `1px solid ${C.borderStrong}` }}>
      {label && <div className="font-semibold mb-1" style={{ color: C.text }}>{label}</div>}
      {payload.map((p, i) => (

          <span className="font-semibold" style={{ color: C.text }}>{money ? fmtBRL(p.value) : p.value}</span>
        </div>
      ))}
    </div>
  );
}

function VisaoGeral({ competencia }) {
  const d = useCompetencia(competencia);
  const k = KPIS[competencia];
  const heroNum = useCountUp(d.total, [competencia]);
  const mesIdx = MENSAL.findIndex((m) => m.mes === d.mesAtual);
  const trilha = MENSAL.slice(0, mesIdx + 1);

      <div className="rounded-2xl p-6 md:p-7 relative overflow-hidden" style={{ background: `linear-gradient(135deg, ${C.surface} 0%, #10241A 60%, #12281C 100%)`, border: `1px solid ${C.border}` }}>

            </ResponsiveContainer>
          </div>
        </ChartCard>

        <ChartCard title="Comparativo antes × depois" subtitle="Fevereiro vs competência atual">
          <div className="flex flex-col gap-3">
            {comparativos.map((c) => (
              <div key={c.titulo} className="rounded-xl px-4 py-3" style={{ background: C.surfaceAlt }}>
                <div className="flex items-center justify-between mb-1">
                  <span className="text-sm" style={{ color: C.textDim }}>{c.titulo}</span>
                  <span className="text-sm font-semibold" style={{ color: c.bom ? C.neon : C.alerta }}>{c.sinal}{c.delta}%</span>
                </div>
                <div className="flex items-center gap-2 font-sora">
                  <span style={{ color: C.textFaint, fontSize: 18 }}>{c.antes}</span>
                  <span style={{ color: C.textFaint }}>→</span>
                  <span className="font-bold" style={{ color: C.text, fontSize: 18 }}>{c.depois}</span>
                </div>
              </div>
            ))}
          </div>
          <p className="text-xs mt-4" style={{ color: C.textFaint }}>Menos custo por cotação e mais cotações geradas após as otimizações.</p>
        </ChartCard>
      </div>
    </div>
  );
}

function EmBreve({ titulo, fase, descricao, icon }) {
  return (
    <div className="rounded-2xl flex flex-col items-center justify-center text-center px-6" style={{ background: C.surface, border: `1px dashed ${C.borderStrong}`, minHeight: 420 }}>
      <div className="rounded-2xl p-4 mb-4" style={{ background: C.surfaceAlt }}><Icon name={icon} size={28} color={C.laranja} /></div>
      <h2 className="font-sora font-bold" style={{ color: C.text, fontSize: 22 }}>{titulo}</h2>
      <div className="mt-2 rounded-full px-3 py-1 text-xs font-semibold" style={{ background: "rgba(249,115,22,0.15)", color: C.laranja }}>{fase}</div>
      <p className="mt-4 text-sm max-w-md" style={{ color: C.textDim, lineHeight: 1.6 }}>{descricao}</p>
    </div>
  );
}

function App() {
  const [active, setActive] = useState("geral");
  const [competencia, setCompetencia] = useState("Setembro 2026");
  const titulos = {
    geral: { t: "Visão Geral", s: "Os números que importam, num só lugar" },
    comercial: { t: "Comercial", s: "Faturamento, metas e desempenho da equipe" },
    trafego: { t: "Tráfego & Marketing", s: "Google Ads, leads e custo por cotação" },
    custos: { t: "Custos & Frota", s: "Combustível, consumo e manutenção" },
    leads: { t: "Leads (Atendimento IA)", s: "Captação e distribuição pelo agente de WhatsApp" },
  };
  return (
    <div className="flex min-h-screen" style={{ background: TENANT.cores.bg }}>
      <Sidebar active={active} setActive={setActive} />
      <div className="flex-1 flex flex-col min-w-0">
        <MobileNav active={active} setActive={setActive} />
        <main className="flex-1 p-5 md:p-8 max-w-[1240px] w-full mx-auto">
          <Topbar title={titulos[active].t} subtitle={titulos[active].s} competencia={competencia} setCompetencia={setCompetencia} />
          {active === "geral" && <VisaoGeral competencia={competencia} />}
          {active === "comercial" && <Comercial competencia={competencia} />}
          {active === "trafego" && <Trafego competencia={competencia} />}
          {active === "custos" && <EmBreve icon="Fuel" titulo="Painel de Custos & Frota" fase="Fase 3" descricao="Combustível por veículo e motorista, consumo km/l vs. esperado, manutenção e alertas de desvio. Alimentado pelo chat de conferência da Halwa que grava na tabela custos." />}
          {active === "leads" && <Leads competencia={competencia} />}
          <div className="mt-10 pt-6 flex items-center justify-between text-xs" style={{ borderTop: `1px solid ${C.border}`, color: C.textFaint }}>
            <span>{TENANT.nome} · protótipo de design (dados fictícios)</span>
            <span className="flex items-center gap-1.5"><Icon name="Sparkles" size={12} color={C.neon} /> {TENANT.poweredBy}</span>
          </div>
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
